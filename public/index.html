<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>ScriptForge</title>\n    <style>\n        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }\n        header, footer { background-color: #f4f4f4; padding: 10px; text-align: center; }\n        main { margin: 20px; }\n        form { margin-bottom: 20px; }\n        input[type='text'], input[type='password'] { margin: 5px; padding: 10px; width: calc(100% - 22px); }\n        button { padding: 10px 15px; }\n        #output { margin-top: 20px; border: 1px solid #ccc; padding: 10px; }\n    </style>\n</head>\n<body>\n<header>\n    <h1>ScriptForge</h1>\n</header>\n<main>\n    <h2>Authentication</h2>\n    <form id="authForm">\n        <input type="text" id="username" placeholder="Username" required />\n        <input type="password" id="password" placeholder="Password" required />\n        <button type="submit">Login</button>\n    </form>\n    <h2>Script Generation</h2>\n    <form id="scriptForm">\n        <input type="text" id="scriptTitle" placeholder="Script Title" required />\n        <button type="submit">Generate Script</button>\n    </form>\n    <div id="output"></div>\n</main>\n<footer>\n    <p>&copy; 2026 ScriptForge</p>\n</footer>\n<script>\nconst authForm = document.getElementById('authForm');\nconst scriptForm = document.getElementById('scriptForm');\nconst output = document.getElementById('output');\n\n// Authentication API Integration\nauthForm.onsubmit = async (e) => {\n    e.preventDefault();\n    const username = document.getElementById('username').value;\n    const password = document.getElementById('password').value;\n    const response = await fetch('/api/auth/login', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({ username, password })\n    });\n    const data = await response.json();\n    output.innerHTML = data.message;\n};\n\n// Script Generation API Integration\nscriptForm.onsubmit = async (e) => {\n    e.preventDefault();\n    const title = document.getElementById('scriptTitle').value;\n    const response = await fetch('/api/scripts/generate', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({ title })\n    });\n    const data = await response.json();\n    output.innerHTML += '<br>' + data.script;\n};\n</script>\n</body>\n</html>
